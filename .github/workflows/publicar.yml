# Publica la app en GitHub Pages cada vez que se actualiza la rama main.
# Requiere en el repositorio: Settings > Pages > Source = "GitHub Actions"
# y en Settings > Secrets and variables > Actions > Variables:
#   VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY (valores públicos; NUNCA la service_role).
name: Publicar app
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/publicar.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  construir:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
